server:
  port: ${SERVER_PORT:8080}

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: g2rain-knowledge
  # 环境切换（dev / nacos 互斥，勿同时激活或 spring.profiles.include）：
  #   SPRING_PROFILES_ACTIVE=dev   → application.yml + application-dev.yml（本地数据源）
  #   SPRING_PROFILES_ACTIVE=nacos → application.yml + application-nacos.yml（注册/配置中心，数据源来自 Nacos）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    jdbc-type-for-null: NULL

g2rain:
  springdoc:
    description: ${spring.application.name}接口文档
  knowledge:
    storage:
      root: ${KNOWLEDGE_STORAGE_ROOT:}
      max-file-size: ${KNOWLEDGE_STORAGE_MAX_FILE_SIZE:10MB}
    docling:
      base-url: ${DOCLING_BASE_URL:}
      api-key: ${DOCLING_API_KEY:}
      connect-timeout: ${DOCLING_CONNECT_TIMEOUT:5s}
      read-timeout: ${DOCLING_READ_TIMEOUT:90s}
    embedding:
      dimension: ${KNOWLEDGE_EMBEDDING_DIMENSION:4096}
      encoding-format: ${KNOWLEDGE_EMBEDDING_ENCODING_FORMAT:}
      connect-timeout: ${MODEL_NEXUS_CONNECT_TIMEOUT:5s}
      read-timeout: ${MODEL_NEXUS_READ_TIMEOUT:30s}
    milvus:
      uri: ${MILVUS_URI:http://milvus:19530}
      token: ${MILVUS_TOKEN:}
      collection-name: ${KNOWLEDGE_MILVUS_COLLECTION:g2rain_knowledge_chunks_qwen_4096_v1}
    retrieve:
      default-top-k: ${KNOWLEDGE_RETRIEVE_DEFAULT_TOP_K:5}
      max-top-k: ${KNOWLEDGE_RETRIEVE_MAX_TOP_K:20}
      total-timeout-ms: ${KNOWLEDGE_RETRIEVE_TOTAL_TIMEOUT_MS:8000}
    answer:
      connect-timeout: ${KNOWLEDGE_ANSWER_CONNECT_TIMEOUT:5s}
      read-timeout: ${KNOWLEDGE_ANSWER_READ_TIMEOUT:60s}
    rerank:
      enabled: ${KNOWLEDGE_RERANK_ENABLED:true}
      connect-timeout: ${KNOWLEDGE_RERANK_CONNECT_TIMEOUT:5s}
      read-timeout: ${KNOWLEDGE_RERANK_READ_TIMEOUT:30s}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  endpoint:
    health:
      show-details: when_authorized
