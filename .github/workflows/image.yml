name: Publish container image

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: container-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -s "docs/releases/$GITHUB_REF_NAME.md"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "extra_tags=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test all modules
        run: mvn --batch-mode --no-transfer-progress clean install
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push with Jib
        working-directory: g2rain-knowledge-startup
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          EXTRA_TAGS: ${{ steps.image.outputs.extra_tags }}
        run: |
          args=()
          if [[ -n "$EXTRA_TAGS" ]]; then
            args+=("-Djib.to.tags=$EXTRA_TAGS")
          fi
          mvn --batch-mode --no-transfer-progress -DskipTests=true compile jib:build \
            "-Djib.to.image=$IMAGE_NAME:$IMAGE_TAG" \
            "${args[@]}"
          echo "Published: \`$IMAGE_NAME:$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Additional tags: \`$EXTRA_TAGS\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
